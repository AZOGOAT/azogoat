name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # METRICS_TOKEN must be a classic PAT (GraphQL API); fine-grained tokens fail
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          user: AZOGOAT
          base: ""
          config_timezone: Europe/Zurich
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
